<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="WaveTune - catálogo musical con reproductor glassy"
    />
    <meta name="theme-color" content="#181820" />
    <title>Glassy_Music · Música</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link
      href="../assets/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../css/music.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Barra lateral de navegación -->
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <div class="sidebar__head">
        <a class="sidebar__brand" href="#albums">
          <svg class="brand-icon" width="26" height="26" viewBox="0 0 24 24" fill="#7cf7ff" aria-hidden="true">
            <path d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2.5v10.67a3 3 0 1 1-2-2.83V6.5L9 8.67z"/>
          </svg>
          <span class="sidebar__label fw-bold">Glassy Music</span>
        </a>
        <button
          id="btnSidebar"
          class="icon-btn sidebar__toggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="true"
          aria-label="Plegar la barra lateral"
          title="Plegar la barra lateral"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar__body">
        <ul class="sidebar__list">
          <li>
            <a class="sidebar__link active" aria-current="page" href="#albums" data-label="Álbumes">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 16a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-11a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
              </svg>
              <span class="sidebar__label">Álbumes</span>
            </a>
          </li>
          <li>
            <a class="sidebar__link" href="#tracks" data-label="Canciones">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
              </svg>
              <span class="sidebar__label">Canciones</span>
            </a>
          </li>
          <li>
            <button
              class="sidebar__link"
              id="navFavs"
              type="button"
              aria-pressed="false"
              data-label="Favoritos"
              title="Mostrar solo favoritos"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 21s-6.7-4.35-9.33-8.06C.9 10.36 2.4 6.5 5.9 6.5c1.9 0 3.3 1.05 4.1 2.35.8-1.3 2.2-2.35 4.1-2.35 3.5 0 5 3.86 3.23 6.44C18.7 16.65 12 21 12 21z"/>
              </svg>
              <span class="sidebar__label">Favoritos</span>
            </button>
          </li>
          <li>
            <button
              class="sidebar__link"
              id="btnQueue"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasQueue"
              aria-controls="offcanvasQueue"
              data-label="Cola"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 6h14v2H4V6zm0 5h14v2H4v-2zm0 5h9v2H4v-2zm12-2.5 4 2.4-4 2.4v-4.8z"/>
              </svg>
              <span class="sidebar__label">Cola</span>
              <span id="queueBadge" class="badge rounded-pill text-bg-primary ms-auto" style="display:none">0</span>
            </button>
          </li>
          <li>
            <button
              class="sidebar__link"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#offcanvasPlaylists"
              aria-controls="offcanvasPlaylists"
              data-label="Playlists"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 6h16V4H4zM4 11h16V9H4zM4 16h10v-2H4zM14 18.2v-4l4 2z"/>
              </svg>
              <span class="sidebar__label">Playlists</span>
            </button>
          </li>
        </ul>
      </div>

      <form class="sidebar__search" role="search" onsubmit="return false">
        <button
          id="btnSearchMini"
          class="icon-btn sidebar__mini"
          type="button"
          data-label="Buscar"
          aria-label="Buscar"
          title="Buscar"
          tabindex="-1"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.6-3.6"/>
          </svg>
        </button>
        <input
          class="form-control form-control-sm sidebar__input"
          id="buscar"
          type="search"
          placeholder="Buscar artista o canción"
          aria-label="Buscar"
        />
      </form>

      <div class="sidebar__foot">
        <button
          id="btnTheme"
          class="icon-btn"
          type="button"
          data-label="Cambiar tema"
          aria-label="Cambiar entre tema claro y oscuro"
          title="Cambiar tema"
        >
          <svg id="iSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5" fill="none"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg id="iMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </aside>
    <div id="sbBackdrop" class="sidebar-backdrop" hidden></div>
    <button
      id="btnSidebarFab"
      class="icon-btn sidebar-fab"
      type="button"
      aria-controls="sidebar"
      aria-expanded="false"
      aria-label="Abrir la barra lateral"
      title="Abrir menú"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
      </svg>
    </button>

    <main class="container py-4">
      <header class="py-4 text-center">
        <p class="lead text-body-secondary">

        </p>
      </header>

      <!-- Filtros y ordenación -->
      <div class="row g-2 justify-content-center mb-4 filter-bar" role="group" aria-label="Filtros y ordenación">
        <div class="col-auto">
          <select id="fSort" class="form-select form-select-sm" aria-label="Ordenar">
            <option value="default">Orden por defecto</option>
            <option value="title">Título A-Z</option>
            <option value="artist">Artista A-Z</option>
            <option value="year-desc">Año (recientes primero)</option>
            <option value="year-asc">Año (antiguos primero)</option>
            <option value="duration">Duración</option>
          </select>
        </div>
        <div class="col-auto">
          <select id="fArtist" class="form-select form-select-sm" aria-label="Filtrar por artista">
            <option value="">Todos los artistas</option>
          </select>
        </div>
        <div class="col-auto">
          <select id="fYear" class="form-select form-select-sm" aria-label="Filtrar por año">
            <option value="">Todos los años</option>
          </select>
        </div>
      </div>

      <!-- Sección Álbumes -->
      <section id="albums">
        <h2 class="h4 section-title mb-3">
          <span class="badge text-bg-primary">Álbumes</span>
        </h2>
        <div id="albumGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
      </section>

      <!-- Sección Canciones -->
      <section id="tracks" class="mt-5">
        <h2 class="h4 section-title mb-3">
          <span class="badge text-bg-primary">Canciones</span>
        </h2>
        <div id="trackList" class="list-group list-group-flush"></div>
      </section>
    </main>

    <!-- Reproductor glassy (fijo abajo) -->
    <div id="player" class="glass-player" role="region" aria-label="Reproductor">
      <button id="pExpandToggle" class="gbtn glass-player__expand-toggle" type="button" aria-label="Ampliar reproductor" title="Ampliar reproductor" aria-expanded="false" aria-controls="player">
        <svg id="iExpand" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 15 12 9 18 15"/>
        </svg>
        <svg id="iCollapse" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- Cola upcoming: solo visible en el layout ampliado -->
      <div class="glass-player__queue" id="pQueuePanel">
        <h2 class="glass-player__queue-title">A continuación</h2>
        <div id="pQueueList" class="glass-player__queue-list"></div>
      </div>

      <div class="glass-player__art">
        <img id="pArt" src="" alt="Portada del álbum" draggable="false" tabindex="0" role="button" aria-label="Ampliar reproductor" />
        <span id="pLive" class="visually-hidden" aria-live="polite"></span>
      </div>
      <div class="glass-player__info">
        <div id="pTitle" class="fw-semibold">Elige una canción</div>
        <div id="pArtist" class="text-body-secondary small">—</div>
      </div>
      <div class="glass-player__controls">
        <button id="pShuffle" class="gbtn" type="button" aria-label="Aleatorio" title="Aleatorio desactivado" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>
        <button id="pPrev" class="gbtn" type="button" aria-label="Anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM18 6l-8 6 8 6z"/></svg>
        </button>
        <button id="pPlay" class="gbtn gbtn--play" type="button" aria-label="Reproducir">
          <svg id="iPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="pNext" class="gbtn" type="button" aria-label="Siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6l8 6-8 6z"/></svg>
        </button>
        <button id="pRepeat" class="gbtn" type="button" aria-label="Repetición" title="Repetición desactivada" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
          <span id="pRepeatOne" class="gbtn__badge" style="display:none" aria-hidden="true">1</span>
        </button>
      </div>
      <div class="glass-player__viz">
        <canvas id="pViz" aria-hidden="true"></canvas>
      </div>
      <div class="glass-player__timeline">
        <span id="pCurrent" class="time">0:00</span>
        <input id="pSeek" type="range" min="0" max="100" value="0" aria-label="Progreso" />
        <span id="pDuration" class="time">0:00</span>
      </div>
      <div class="glass-player__side">
        <input id="pVol" type="range" min="0" max="100" value="80" aria-label="Volumen" title="Volumen" />
        <button id="pMute" class="gbtn" type="button" aria-label="Silenciar">
          <svg id="iVol" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>
          <svg id="iMute" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8l6 8M22 8l-6 8"/></svg>
        </button>
      </div>
    </div>

    <!-- Cola de reproducción -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasQueue" aria-labelledby="offcanvasQueueLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasQueueLabel">Cola de reproducción</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
        <p class="small text-body-secondary">Arrastra para reordenar las canciones.</p>
        <ul id="queueList" class="list-unstyled queue-list m-0"></ul>
      </div>
    </div>

    <!-- Playlists -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasPlaylists" aria-labelledby="offcanvasPlaylistsLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasPlaylistsLabel">Mis playlists</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
        <div class="input-group input-group-sm mb-2">
          <input id="plName" class="form-control" type="text" placeholder="Nombre de la playlist" aria-label="Nombre de la playlist" />
          <button id="plCreate" class="btn btn-primary" type="button">Crear</button>
        </div>
        <p id="plPending" class="small text-body-secondary d-none mb-2"></p>
        <div id="plList"></div>
      </div>
    </div>

    <div id="wtToast" class="wt-toast" role="status" aria-live="polite"></div>

    <audio id="audio" preload="metadata"></audio>
    <audio id="preload" preload="auto"></audio>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/catalog.js"></script>
    <script src="../js/music-player.js"></script>
  </body>
</html>
